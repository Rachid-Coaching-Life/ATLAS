name: tests

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  unit:
    name: Unit tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 🧪 Verify staged release publication
        run: |
          npm install --prefix "$RUNNER_TEMP/release-plugin" --ignore-scripts --no-audit --no-fund @semantic-release/github@9
          node tests/release_publication.mjs "$RUNNER_TEMP/release-plugin/node_modules/@semantic-release/github"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev pulseaudio libegl1 libxkbcommon0
      - name: Start headless audio server for test imports
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: |
          python -m pytest -q -m unit
      - name: Diagnose audio capture boundary repeatability
        if: success() || failure()
        run: |
          python -m pytest -q tests/test_audio_capture_pipeline.py -k test_speech_reaches_whisper_at_configured_boundary --count=10

      - name: Verify ATLAS confirmation gate and desktop IPC
        if: success() || failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_confirmation_gate.py tests/test_confirmation_ipc.py tests/test_confirmation_mcp.py tests/test_desktop_confirmation_log.py tests/test_desktop_confirmation_bridge.py tests/test_confirmation_hardening.py tests/test_local_files_confirmation_fidelity.py

      - name: 🧪 Verify local provider transport
        run: |
          python -m pytest -q -m integration tests/test_openai_compatible_e2e.py tests/test_provider_model_resolution.py tests/test_setup_wizard.py tests/test_local_llm_privacy.py


  localfiles-windows:
    name: Local files confirmation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify local file path and confirmation protections
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_local_files_confirmation_fidelity.py tests/test_local_files_path_arguments.py tests/test_local_files_glob_confinement.py
      - name: Verify Windows PDF cancellation cannot open a file afterward
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_file_inventory.py -k "cancellation_during_pdf_resolution_never_launches or cancel_after_windows_pdf_launch_started_cannot_claim_it_was_stopped"
      - name: Verify private voice WAV admission on Windows (synthetic test data)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_chatterbox_private_reference.py
      - name: Check Pocket TTS bridge on Windows (synthetic test data only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_pocket_tts_bridge.py tests/test_pocket_tts_reliability.py
      - name: Check official Pocket TTS Windows executable CLI (no model or voice)
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'https://github.com/kyutai-labs/pocket-tts/releases/download/v4.0.1/pocket-tts-3.3.0-x86_64-pc-windows-msvc.zip'
          $expected = '98753041f2e65744b989776f87bccb93f1f574a08afe1890c5427ec94cd6309c'
          $zip = Join-Path $env:RUNNER_TEMP 'pocket-tts-official.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'pocket-tts-official'
          Invoke-WebRequest -Uri $release -OutFile $zip
          $checksum = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $expected) { throw 'Official Pocket TTS archive checksum mismatch' }
          Expand-Archive -Path $zip -DestinationPath $folder -Force
          $binary = Get-ChildItem -Path $folder -Recurse -File -Filter 'pocket-tts.exe' | Select-Object -First 1
          if ($null -eq $binary) { throw 'Pocket TTS executable absent from verified archive' }
          $env:ATLAS_PUBLIC_POCKET_EXECUTABLE = $binary.FullName
          python -c "import hashlib, os, runpy; from pathlib import Path; m = runpy.run_path('scripts/prepare_pocket_voice.py'); assert hashlib.sha256(Path(os.environ['ATLAS_PUBLIC_POCKET_EXECUTABLE']).read_bytes()).hexdigest() == m['EXPECTED_BINARY_SHA256']"
          if ($LASTEXITCODE -ne 0) { throw 'Official executable does not match the preparation pin' }
          Write-Output '::notice title=ATLAS official Pocket executable::Extracted executable SHA256 matches preparation pin after archive checksum verification.'
          & $binary.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Pocket TTS --version failed' }
          $serveHelp = (& $binary.FullName serve --help) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw 'Pocket TTS serve --help failed' }
          foreach ($flag in @('--language', '--default-voice', '--host', '--port')) {
            if (-not $serveHelp.Contains($flag)) { throw "Pocket TTS CLI missing required flag: $flag" }
          }
          Write-Output 'Verified release SHA256 and local serve CLI arguments; no weights loaded.'
          $env:ATLAS_PUBLIC_POCKET_ARCHIVE = $zip
          @'
          import os
          from pathlib import Path
          import sys
          import tempfile
          from unittest.mock import patch
          sys.path.insert(0, 'scripts')
          import atlas_voice_setup as setup
          # Real verified executable, real Windows staging and process launch;
          # replace only the network transfer with the already verified archive.
          archive = Path(os.environ['ATLAS_PUBLIC_POCKET_ARCHIVE'])
          with tempfile.TemporaryDirectory(prefix='atlas-official-probe-', dir=os.environ['RUNNER_TEMP']) as folder:
              with patch.object(setup, 'urlopen', side_effect=lambda *a, **kw: archive.open('rb')):
                  installed = setup.install_official_binary(Path(folder))
              assert installed.is_file()
              assert list(installed.parent.iterdir()) == [installed]
              with patch.object(setup, 'urlopen', side_effect=AssertionError('unexpected download')):
                  assert setup.install_official_binary(Path(folder)) == installed
          print('::notice title=ATLAS official Pocket installation::Real Windows staged executable validation, atomic installation and verified cache reuse succeeded; no model or private voice.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Official Windows staged installation probe failed' }
      - name: Generate real French WAV on Windows with public Estelle (no personal voice)
        if: success() || failure()
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'pocket-tts-official'
          $binary = Get-ChildItem -Path $folder -Recurse -File -Filter 'pocket-tts.exe' | Select-Object -First 1
          if ($null -eq $binary) { throw 'Verified Pocket TTS executable is missing' }
          $online = Join-Path $env:RUNNER_TEMP 'atlas-public-french-online.wav'
          $offline = Join-Path $env:RUNNER_TEMP 'atlas-public-french-offline.wav'
          $env:HF_TOKEN = ''
          $env:HUGGING_FACE_HUB_TOKEN = ''
          $env:HF_ENDPOINT = 'https://huggingface.co'
          & $binary.FullName generate --language french --voice estelle --text 'Bonjour, je suis Atlas et je vérifie ma synthèse vocale française.' --output-path $online
          if ($LASTEXITCODE -ne 0) { throw 'Public French model failed to generate speech on Windows' }
          # Reuse only the public model and Estelle voice already cached; deny remote HF.
          $env:HF_ENDPOINT = 'http://127.0.0.1:9'
          $env:HF_HUB_OFFLINE = '1'
          & $binary.FullName generate --language french --voice estelle --text 'Bonjour, voici une deuxième phrase française sans accès distant.' --output-path $offline
          if ($LASTEXITCODE -ne 0) { throw 'Cached public French model failed offline on Windows' }
          $env:ATLAS_PUBLIC_TTS_ONLINE = $online
          $env:ATLAS_PUBLIC_TTS_OFFLINE = $offline
          @'
          import array
          import os
          import wave
          for name in ('ATLAS_PUBLIC_TTS_ONLINE', 'ATLAS_PUBLIC_TTS_OFFLINE'):
              with wave.open(os.environ[name], 'rb') as wav:
                  assert wav.getnchannels() == 1, 'unexpected channel count'
                  assert wav.getsampwidth() == 2, 'not 16-bit PCM'
                  assert 8000 <= wav.getframerate() <= 48000, 'unexpected sample rate'
                  assert 0.2 <= wav.getnframes() / wav.getframerate() <= 40, 'implausible audio duration'
                  pcm = wav.readframes(wav.getnframes())
                  assert len(pcm) == wav.getnframes() * 2, 'truncated PCM'
              samples = array.array('h')
              samples.frombytes(pcm)
              assert max(map(abs, samples)) > 50, 'silence instead of generated speech'
              print('Verified public French audio structure and non-silent PCM: ' + name)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Public French WAV structural validation failed' }
          # Artifacts stay on the temporary runner and are never uploaded.


  private-voice-windows:
    name: Private voice preparation (Windows, synthetic)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated preparation test dependencies
        run: python -m pip install pytest==8.3.2 python-dotenv==1.0.1
      - name: Validate local Pocket voice profile preparation on Windows (synthetic only)
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_prepare_pocket_voice.py --junitxml="$env:RUNNER_TEMP/atlas-private-voice.xml"

      - name: Check one-run private voice launcher on Windows (synthetic only)
        if: success() || failure()
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_atlas_voice_setup.py --junitxml="$env:RUNNER_TEMP/atlas-voice-launcher.xml"

      - name: Report private voice Windows synthetic results
        if: success() || failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for filename in ('atlas-private-voice.xml', 'atlas-voice-launcher.xml'):
              report = Path(os.environ['RUNNER_TEMP']) / filename
              if not report.is_file():
                  raise SystemExit('Missing Windows synthetic test report: ' + filename)
              root = ET.parse(report).getroot()
              suites = list(root.iter('testsuite'))
              counts = {key: sum(int(s.get(key, '0')) for s in suites)
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              passed = counts['tests'] - counts['failures'] - counts['errors'] - counts['skipped']
              print('::notice title=ATLAS private voice Windows::' + filename
                    + ': passed=' + str(passed) + ', failures=' + str(counts['failures'])
                    + ', errors=' + str(counts['errors']) + ', skipped=' + str(counts['skipped']))
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      message = failure.get('message', '')[:3000]
                      for key in ('RUNNER_TEMP', 'USERPROFILE', 'GITHUB_WORKSPACE'):
                          value = os.environ.get(key)
                          if value:
                              message = message.replace(value, '<' + key + '>')
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::notice title=ATLAS synthetic Windows failure::' + case.get('name', '') + ': ' + message)
              if counts['failures'] or counts['errors'] or counts['skipped']:
                  raise SystemExit('Windows private voice checks did not all execute successfully')


  private-voice-package-windows:
    name: Final code-only voice ZIP qualification (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install qualification test dependencies
        run: python -m pip install pytest==8.3.2 python-dotenv==1.0.1
      - name: Qualify exact ZIP and real CMD without a WAV
        timeout-minutes: 3
        run: python -m pytest -q -s tests/test_private_voice_package.py

  daemon-lock:
    name: Daemon lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify native daemon ownership
        run: python tests/fixtures/daemon_lock_probe.py
      - name: Verify shared activity publication
        run: python tests/fixtures/activity_publication_probe.py

  piper-download:
    name: Piper downloads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install download test dependencies
        run: python -m pip install pytest requests python-dotenv
      - name: Verify voice download publication and recovery
        run: python -m pytest -q tests/test_piper_download_concurrency.py tests/test_piper_download_recovery.py

  dictation-history:
    name: Dictation history (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install history test dependencies
        run: python -m pip install pytest python-dotenv filelock==3.32.7
      - name: Verify saved history publication and writer coordination
        run: python -m pytest -q tests/test_dictation_history_writers.py tests/test_dictation_history_atomic_save.py tests/test_dictation_history_read_failure.py tests/test_dictation_history_record_validation.py


  search-transport:
    name: Search transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Qualify source and frozen native search requests
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import shutil
          dependency = next(line for line in Path('requirements.txt').read_text().splitlines()
                            if line.startswith('curl_cffi=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', dependency,
                          'pytest', 'python-dotenv', 'pyinstaller', 'cryptography'], check=True)
          # A narrow source copy avoids shadowing stdlib types with tools/types.py.
          probe_source = Path('build/search-native/source')
          probe_source.mkdir(parents=True, exist_ok=True)
          shutil.copyfile('src/atlas/tools/search_http.py', probe_source / 'search_http.py')
          subprocess.run([sys.executable, '-m', 'PyInstaller', '--noconfirm', '--clean',
                          '--onedir', '--name', 'search-probe', '--paths', str(probe_source),
                          '--additional-hooks-dir', 'installer/hooks',
                          '--distpath', 'build/search-native/dist', '--workpath', 'build/search-native/work',
                          '--specpath', 'build/search-native', 'tests/fixtures/search_transport_probe.py'], check=True)
          env = os.environ.copy()
          executable = 'search-probe.exe' if os.name == 'nt' else 'search-probe'
          env['ATLAS_SEARCH_PROBE_EXE'] = str(Path('build/search-native/dist/search-probe', executable).resolve())
          subprocess.run([sys.executable, '-m', 'pytest', '-q', '-m', 'integration',
                          'tests/test_search_http.py'], env=env, check=True)
